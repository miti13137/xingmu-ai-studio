<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星幕 V3 素材備份</title><style>body{font-family:system-ui,sans-serif;background:#10121f;color:#f4f0e8;max-width:760px;margin:auto;padding:22px;line-height:1.6}section{background:#202338;border-radius:16px;padding:20px;margin:16px 0}button{background:#e5bf72;border:0;border-radius:10px;padding:12px 16px;font-size:16px;color:#17121a;cursor:pointer}button:disabled{opacity:.45}a{color:#ffe3a4}.item{padding:12px 0;border-bottom:1px solid #41445a}.small{color:#c9c8d3}#status{white-space:pre-wrap}</style></head><body><h1>星幕 V3 素材備份</h1><p>讀取這台裝置、這個瀏覽器內的星幕資料，供您逐一下載。此頁不會上傳資料，也不會修改或刪除原始作品與素材。</p><section><h2>第一步：備份作品文字</h2><p>包含劇本、角色設定和分鏡，不包含照片與影片。</p><button id="projects" disabled>下載所有作品 JSON</button></section><section><h2>第二步：備份照片及影片</h2><p class="small">請使用原本儲存素材的 iPhone Safari 開啟此頁；每個檔案分別點選下載。若作品曾移動或刪除鏡頭，請核對實際內容。</p><div id="assets">讀取中…</div></section><section><h2>第三步：提供檔案</h2><p>在 iPhone「檔案」App 的「下載項目」找到 JSON、照片及影片，在對話輸入框按「＋」上傳。檔案太大時可分批提供。</p><p id="status" role="status"></p><a href="v3-test.html">返回 V3 工作台</a></section><script>
'use strict';
const statusEl=document.getElementById('status'), list=document.getElementById('assets');
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function safe(s){return String(s).replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').slice(0,100)}
let data=null;try{const raw=localStorage.getItem('xingmu-studio-v1');if(raw){data=JSON.parse(raw);if(!Array.isArray(data.projects))throw Error('作品資料格式不正確');document.getElementById('projects').disabled=false;document.getElementById('projects').onclick=()=>download(new Blob([raw],{type:'application/json'}),'星幕-作品文字備份.json')}else statusEl.textContent='這個瀏覽器沒有找到作品文字資料。'}catch(e){statusEl.textContent='讀取作品文字失敗：'+e.message}
function openAssets(){return new Promise((resolve,reject)=>{const request=indexedDB.open('xingmu-studio-v3-assets',1);let created=false;request.onupgradeneeded=()=>{created=true;request.transaction.abort()};request.onerror=()=>{if(created)resolve(null);else reject(request.error)};request.onsuccess=()=>resolve(request.result)})}
function readAll(db){return new Promise((resolve,reject)=>{const items=[],tx=db.transaction('files','readonly'),req=tx.objectStore('files').openCursor();req.onsuccess=()=>{const cursor=req.result;if(cursor){items.push([cursor.key,cursor.value]);cursor.continue()}};tx.oncomplete=()=>resolve(items);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('讀取中斷'))})}
function label(key){const m=String(key).match(/^(.*):(character|shotimage|shotvideo):(\d+)$/);if(!m)return {name:'其他素材',file:'其他素材-'+String(key)};const p=data?.projects?.find(x=>x.id===m[1]);const number=Number(m[3])+1;const kind={character:'角色照片',shotimage:'場景圖片',shotvideo:'鏡頭影片'}[m[2]];const who=m[2]==='character'&&p?.characters?.[m[3]]?.name? ' '+p.characters[m[3]].name:'';return {name:(p?.name||'未對應作品')+' · '+kind+' '+number+who,file:(p?.name||'未對應作品')+'-'+kind+'-'+number+who}}
(async()=>{let db;try{db=await openAssets();if(!db){list.textContent='這個瀏覽器沒有找到 V3 素材資料。';return}if(!db.objectStoreNames.contains('files'))throw Error('找不到素材儲存區');const items=await readAll(db);list.textContent='';if(!items.length){list.textContent='這個瀏覽器沒有找到照片或影片。';return}for(const [key,blob] of items){if(!(blob instanceof Blob))continue;const l=label(key),div=document.createElement('div'),title=document.createElement('div'),meta=document.createElement('div'),button=document.createElement('button');div.className='item';title.textContent=l.name;meta.className='small';meta.textContent=(blob.size/1024/1024).toFixed(2)+' MB · '+(blob.type||'未知格式');button.textContent='下載';const ext={'video/mp4':'mp4','video/webm':'webm','image/png':'png','image/webp':'webp','image/jpeg':'jpg'}[blob.type]||'bin';button.onclick=()=>download(blob,safe(l.file)+'.'+ext);div.append(title,meta,button);list.appendChild(div)}statusEl.textContent='找到 '+items.length+' 個素材。'}catch(e){list.textContent='讀取失敗：'+e.message}finally{db?.close()}})();
</script></body></html>
