<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星幕｜本機影片合成測試版</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#0f101b;color:#f3efe8;font:16px/1.6 system-ui,sans-serif}header{padding:20px 5%;border-bottom:1px solid #353448;background:#191a29}main{max-width:900px;margin:auto;padding:20px}.card{background:#202133;border:1px solid #39394c;padding:22px;border-radius:16px;margin:18px 0}h1,h2{line-height:1.3}h1{font-size:25px;margin:0}h2{font-size:20px}.muted{color:#c9c5ce}button,.download{border:0;border-radius:9px;padding:11px 17px;font:inherit;font-weight:bold;cursor:pointer;background:#e2ba70;color:#211a14;display:inline-block;text-decoration:none}button:disabled{opacity:.45}button.secondary{background:#424257;color:white}label{display:block;margin:12px 0 4px}input,textarea,select{font:inherit;color:#fff;background:#111320;border:1px solid #666477;border-radius:8px;padding:10px;width:100%}input[type=file]{padding:8px}textarea{min-height:70px}.shot{padding:15px;background:#171827;border-radius:12px;margin:12px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.warning{border-left:4px solid #e2ba70;padding-left:12px}#status{white-space:pre-wrap}a{color:#ffe2a4}
</style></head><body><header><h1>✦ 星幕 AI Studio <small>影片合成測試版</small></h1></header><main><section class="card"><h2>把鏡頭剪成一支影片</h2><p class="warning">這是本機測試版：只處理您提供的影片與音樂，不會生成 AI 影片或配音，也沒有嘴型同步功能。開始前請保留原始檔案。</p><p class="muted">目前在電腦本機執行；不連接雲端，不會收費。工作資料只在程式執行期間暫存，關閉程式即清除，完成後請下載影片。</p><label for="ratio">影片比例</label><select id="ratio"><option>9:16</option><option>16:9</option></select><label for="project">可選：匯入 V3 作品 JSON（帶入分鏡對白）</label><input id="project" type="file" accept="application/json,.json"><p class="muted">V3 的 JSON 不包含圖片或影片；匯入後仍需選擇每個鏡頭影片。若備份包含多個作品，將列出作品供選擇。</p><div id="projectselect"></div></section><section class="card"><h2>鏡頭與字幕</h2><p class="muted">依排列順序合成；字幕會顯示於整個鏡頭，時間未依語音自動對齊。</p><div id="shots"></div><div class="bar"><button id="add" type="button" class="secondary">＋ 新增鏡頭</button></div></section><section class="card"><h2>背景音樂</h2><label for="music">選擇音樂檔案（可不選）</label><input id="music" type="file" accept="audio/*"><p class="muted">音樂會混入原有影片聲音；請使用有權使用的素材。</p></section><section class="card"><div class="bar"><button id="render" type="button">開始合成 MP4</button><a id="download" class="download" hidden>下載影片</a></div><p id="status" role="status">尚未開始</p></section></main><script>
'use strict';const token='__SESSION_TOKEN__',shots=document.querySelector('#shots'),statusEl=document.querySelector('#status'),renderBtn=document.querySelector('#render'),download=document.querySelector('#download');
function addShot(dialogue=''){const div=document.createElement('div');div.className='shot';const title=document.createElement('strong'),videoLabel=document.createElement('label'),file=document.createElement('input'),textLabel=document.createElement('label'),text=document.createElement('textarea'),remove=document.createElement('button');title.textContent='鏡頭';videoLabel.textContent='選擇鏡頭影片';file.type='file';file.accept='video/*';textLabel.textContent='字幕／對白（可留白）';text.value=dialogue;text.maxLength=2000;remove.type='button';remove.className='secondary';remove.textContent='移除此鏡頭';remove.onclick=()=>{if(shots.children.length>1){div.remove();numberShots()}};div.append(title,videoLabel,file,textLabel,text,remove);shots.appendChild(div);numberShots()}
function numberShots(){[...shots.children].forEach((s,i)=>s.querySelector('strong').textContent=`鏡頭 ${i+1}`)}
document.querySelector('#add').onclick=()=>{if(shots.children.length<50)addShot()};addShot();
function loadProject(p){if(!Array.isArray(p.shots))throw Error('這個作品沒有分鏡');if(p.shots.length>50)throw Error('測試版最多 50 個鏡頭');shots.replaceChildren();(p.shots.length?p.shots:[{}]).forEach(s=>addShot(typeof s.dialogue==='string'?s.dialogue:''));if(['9:16','16:9'].includes(p.ratio))document.querySelector('#ratio').value=p.ratio;statusEl.textContent='已帶入分鏡文字，請選擇各鏡頭影片。'}
document.querySelector('#project').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());const list=Array.isArray(data.projects)?data.projects:[data];if(!list.length)throw Error('備份沒有作品');const area=document.querySelector('#projectselect');area.replaceChildren();if(list.length===1){loadProject(list[0]);return}const select=document.createElement('select'),button=document.createElement('button');list.forEach((p,i)=>{let option=document.createElement('option');option.value=i;option.textContent=p.name||`作品 ${i+1}`;select.append(option)});button.type='button';button.textContent='帶入選定作品';button.onclick=()=>{try{loadProject(list[Number(select.value)])}catch(err){statusEl.textContent='匯入失敗：'+err.message}};area.append(select,button)}catch(err){statusEl.textContent='匯入失敗：'+err.message}};
async function post(url,body,type){const response=await fetch(url,{method:'POST',headers:{'X-Xingmu-Token':token,'Content-Type':type},body});const data=await response.json();if(!response.ok)throw Error(data.error||'操作失敗');return data}
async function poll(id){for(;;){await new Promise(r=>setTimeout(r,1500));let res=await fetch('/api/jobs/'+id,{cache:'no-store'});let data=await res.json();if(!res.ok)throw Error(data.error);if(data.status==='done')return;if(data.status==='error')throw Error(data.error||'合成失敗')}}
renderBtn.onclick=async()=>{try{const rows=[...shots.children],files=rows.map(r=>r.querySelector('input').files[0]);if(files.some(f=>!f))throw Error('請為每個鏡頭選擇影片');if(files.some(f=>f.size>100*1024*1024))throw Error('每個檔案須小於 100 MB');let music=document.querySelector('#music').files[0];if(music&&music.size>100*1024*1024)throw Error('音樂檔案須小於 100 MB');renderBtn.disabled=true;download.hidden=true;statusEl.textContent='建立合成工作…';const config={ratio:document.querySelector('#ratio').value,shots:rows.map(r=>({dialogue:r.querySelector('textarea').value}))};let {id}=await post('/api/jobs',JSON.stringify(config),'application/json');for(let i=0;i<files.length;i++){statusEl.textContent=`載入鏡頭 ${i+1} / ${files.length}…`;await post(`/api/jobs/${id}/clip/${i}`,files[i],'application/octet-stream')}if(music){statusEl.textContent='載入音樂…';await post(`/api/jobs/${id}/music`,music,'application/octet-stream')}statusEl.textContent='影片合成中，請保持視窗及本機程式開啟…';await post(`/api/jobs/${id}/render`,'','application/octet-stream');await poll(id);download.href=`/api/jobs/${id}/download`;download.hidden=false;statusEl.textContent='合成完成，請下載並播放確認。'}catch(e){statusEl.textContent='無法完成：'+e.message}finally{renderBtn.disabled=false}};
</script></body></html>
