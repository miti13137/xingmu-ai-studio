name: Xingmu Flow Windows package validation

on:
  push:
    branches: [develop-flow-workbench]
    paths:
      - 'production/**'
      - 'tests/**'
      - 'packaging/**'
      - '.github/workflows/flow-windows-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Windows build tools
        shell: pwsh
        run: |
          python -m pip install 'pyinstaller>=6.14,<7'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-essentials.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'ffmpeg-essentials'
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile $archive
          Expand-Archive $archive -DestinationPath $directory
          $bin = (Get-ChildItem $directory -Recurse -Filter ffprobe.exe | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw 'FFmpeg build is missing ffprobe.exe' }
          $bin >> $env:GITHUB_PATH
          "XINGMU_MEDIA_TOOLS=$bin" >> $env:GITHUB_ENV
      - name: Verify local workbench
        run: python -m unittest discover -s tests -v
      - name: Build and smoke-test Windows executable
        shell: pwsh
        run: |
          ./packaging/build-windows.ps1
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'Xingmu-clean-profile'
          python packaging/check-package.py dist/Xingmu-Studio/Xingmu-Studio.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Xingmu-Studio-Windows
          path: dist/Xingmu-Studio/
          if-no-files-found: error
          retention-days: 14
